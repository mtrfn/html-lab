<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaugă DB-Lab clasei</title><link rel="stylesheet" href="setup.css"><script src="microsoft-config.js?v=1.3.0"></script><script src="host.js?v=1.3.0"></script><script src="teams-core.js?v=1.3.0"></script><body><main><h1>DB-Lab · laboratorul clasei</h1><p>Lecții SQL, baze de date și ajutor progresiv.</p><p id="status" role="status">Verific configurația…</p><p>Lucrările se păstrează local în browser. Biblioteca clasei se citește din documentele SharePoint ale clasei.</p></main><script>
(async()=>{const note=document.getElementById('status');try{TeamsCore.id(DBLabMicrosoftConfig.clientId);TeamsCore.id(DBLabMicrosoftConfig.tenantId);const ctx=await DBLabHost.ready;if(!ctx)throw Error('Deschide această pagină prin adăugarea aplicației DB-Lab într-un canal standard Teams.');TeamsCore.id(ctx.team?.groupId);if(ctx.channel?.membershipType&&ctx.channel.membershipType!=='Regular')throw Error('Folosește un canal standard al clasei.');const base=new URL('./',location.href);if(base.protocol!=='https:')throw Error('Publică aplicația la o adresă HTTPS înainte de instalare.');microsoftTeams.pages.config.registerOnSaveHandler(async event=>{try{await microsoftTeams.pages.config.setConfig({entityId:'db-lab-'+ctx.team.groupId,suggestedDisplayName:'DB-Lab',contentUrl:new URL('index.html?teams=1',base).href,websiteUrl:base.href});event.notifySuccess()}catch{event.notifyFailure('Fila nu a putut fi salvată. Reîncearcă.')}});microsoftTeams.pages.config.setValidityState(true);note.textContent='Apasă Salvează pentru a adăuga DB-Lab în '+(ctx.team.displayName||'clasă')+'.'}catch(e){note.textContent=e.message+' Verifică și identificatorii din microsoft-config.js.'}})();
</script></body></html>
