<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Configurare HTML Lab</title>
  <style>
    body{font-family:system-ui,"Segoe UI",sans-serif;margin:0;padding:28px;color:#172033;background:#f5f7fb}
    main{max-width:650px;margin:auto;background:#fff;border:1px solid #dfe5ef;border-radius:14px;padding:24px}
    h1{margin-top:0} p{line-height:1.55}.ok{padding:12px;background:#eef5ff;border-radius:8px}
  </style>
  <script src="https://res.cdn.office.net/teams-js/2.56.0/js/MicrosoftTeams.min.js"
    integrity="sha384-ftygCQXhLMbuUBdLMhfAnIFTGb2SAYYAPD9iyq2LRkbWpKkEifAGD+qPVcPgthO2"
    crossorigin="anonymous"></script>
</head>
<body>
<main>
  <h1>HTML Lab</h1>
  <p>Adaugă laboratorul HTML ca filă în acest canal.</p>
  <p class="ok">Apasă <strong>Save / Salvare</strong> în fereastra Teams pentru a finaliza.</p>
</main>
<script>
(async function(){
  await microsoftTeams.app.initialize();
  microsoftTeams.pages.config.registerOnSaveHandler(function(saveEvent){
    microsoftTeams.pages.config.setConfig({
      suggestedDisplayName: "HTML Lab",
      entityId: "html-lab",
      contentUrl: window.location.origin + "/index.html",
      websiteUrl: window.location.origin + "/index.html"
    }).then(function(){ saveEvent.notifySuccess(); })
      .catch(function(){ saveEvent.notifyFailure("Nu s-a putut salva configurarea."); });
  });
  microsoftTeams.pages.config.setValidityState(true);
})();
</script>
</body>
</html>
