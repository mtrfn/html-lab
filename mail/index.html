<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mail</title><style>body{font:18px system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8fc;color:#17365a}main{background:white;padding:2rem;border-radius:18px;box-shadow:0 4px 22px #1232;max-width:480px;text-align:center}a{display:inline-block;background:#1767b1;color:#fff;padding:.9rem 1.4rem;border-radius:8px;text-decoration:none;font-weight:600}p{line-height:1.5}</style><main><h1>Mail</h1><p>Deschide căsuța poștală Microsoft 365.</p><a id="open" href="https://outlook.office.com/mail/" target="_blank" rel="noopener noreferrer">Deschide Outlook</a></main><script src="https://res.cdn.office.net/teams-js/2.0.0/js/MicrosoftTeams.min.js"></script><script>if(window.microsoftTeams){microsoftTeams.app.initialize().then(()=>{document.getElementById('open').addEventListener('click',e=>{if(microsoftTeams.app.openLink){e.preventDefault();microsoftTeams.app.openLink('https://outlook.office.com/mail/').catch(()=>window.open('https://outlook.office.com/mail/','_blank','noopener'));}})}).catch(()=>{});}</script></html>
